<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #10B981;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .warning {
            background-color: #FEF3C7;
            padding: 15px;
            border-left: 4px solid #F59E0B;
            border-radius: 3px;
            margin: 20px 0;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Password Changed Successfully</h1>
    </div>
    <div class="content">
        <p>Hi {{.Username}},</p>

        <p>Your password was successfully changed.</p>

        <div class="warning">
            <p><strong>⚠️ Security Notice:</strong></p>
            <p>If you didn't make this change, please contact our support team immediately.</p>
        </div>

        <p>Thanks,<br>The Offloadr Team</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 Offloadr. All rights reserved.</p>
    </div>
</body>
</html>
