<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- O letter (ring) -->
  <circle cx="256" cy="280" r="140" fill="none" stroke="#FFFFFF" stroke-width="48"/>

  <!-- Upward arrow (representing offloading) -->
  <g transform="translate(256, 160)">
    <!-- Arrow shaft -->
    <rect x="-20" y="-40" width="40" height="100" rx="8" fill="url(#arrowGradient)"/>
    <!-- Arrow head -->
    <polygon points="0,-80 50,-30 30,-30 30,0 -30,0 -30,-30 -50,-30" fill="url(#arrowGradient)"/>
  </g>
</svg>
