<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="50%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Logo icon -->
  <g transform="translate(100, 180)">
    <!-- Icon background -->
    <rect width="120" height="120" rx="24" fill="url(#iconGradient)"/>
    <!-- O letter -->
    <circle cx="60" cy="68" r="35" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Arrow -->
    <g transform="translate(60, 38)">
      <rect x="-6" y="-10" width="12" height="28" rx="2" fill="url(#arrowGradient)"/>
      <polygon points="0,-22 14,-8 8,-8 8,0 -8,0 -8,-8 -14,-8" fill="url(#arrowGradient)"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="250" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Offloadr</text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="500" fill="#F8FAFC">Sell your stuff before you leave campus</text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8">The student marketplace that makes moving out stress-free</text>

  <!-- Trust badges -->
  <g transform="translate(100, 480)">
    <!-- Badge 1 -->
    <g>
      <rect width="180" height="44" rx="22" fill="#1F1F1F" stroke="#16A34A" stroke-width="1"/>
      <circle cx="22" cy="22" r="8" fill="#22C55E"/>
      <text x="42" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#F8FAFC">Campus Verified</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(200, 0)">
      <rect width="160" height="44" rx="22" fill="#1F1F1F" stroke="#16A34A" stroke-width="1"/>
      <circle cx="22" cy="22" r="8" fill="#22C55E"/>
      <text x="42" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#F8FAFC">Safe Meetups</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(380, 0)">
      <rect width="160" height="44" rx="22" fill="#1F1F1F" stroke="#16A34A" stroke-width="1"/>
      <circle cx="22" cy="22" r="8" fill="#22C55E"/>
      <text x="42" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#F8FAFC">Fast Listings</text>
    </g>
  </g>

  <!-- Decorative elements on right side -->
  <g transform="translate(900, 100)" opacity="0.15">
    <circle cx="100" cy="100" r="150" fill="none" stroke="#22C55E" stroke-width="2"/>
    <circle cx="100" cy="100" r="200" fill="none" stroke="#22C55E" stroke-width="1"/>
    <circle cx="100" cy="100" r="250" fill="none" stroke="#22C55E" stroke-width="0.5"/>
  </g>

  <!-- CTA hint -->
  <g transform="translate(900, 520)">
    <rect width="200" height="50" rx="25" fill="#F59E0B"/>
    <text x="100" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="middle">Start Selling</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentLine)"/>
</svg>
