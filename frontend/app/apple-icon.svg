<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>

  <!-- O letter (ring) -->
  <circle cx="90" cy="100" r="50" fill="none" stroke="#FFFFFF" stroke-width="16"/>

  <!-- Upward arrow -->
  <g transform="translate(90, 55)">
    <rect x="-8" y="-15" width="16" height="40" rx="3" fill="url(#arrowGrad)"/>
    <polygon points="0,-32 20,-12 12,-12 12,0 -12,0 -12,-12 -20,-12" fill="url(#arrowGrad)"/>
  </g>
</svg>
